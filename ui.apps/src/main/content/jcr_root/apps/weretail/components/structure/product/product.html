<div class="we-Product cq-dd-product-data-reference"
     data-sly-use.productModel="we.retail.core.model.ProductModel"
     data-sly-use.hapiProduct="${'org.apache.sling.hapi.sightly.HApiUse' @ type='/apps/public/weretail/hapi_types/product'}"
     data-sly-attribute="${hapiProduct.itemtype}">

    <div data-sly-test="${wcmmode.edit && !productModel.hasVariants}" class="cq-placeholder"
         data-emptytext="${'Product Component' @ i18n}"></div>

    <sly data-sly-test="${productModel.productItem}">
        <we-product-variant
            data-sly-repeat.productItem="${productModel.productItem.variants}"
            is-base="${productItemList.first ? 1 : 0}"
            path="${productItem.path}"
            page-path="${productItem.pagePath}"
            variants="${productItem.variants}"
            sku="${productItem.sku}"
            title="${productItem.title}"
            description="${productItem.description}"
            price="${productItem.price}"
            summary="${productItem.summary}"
            image="${productItem.imageUrl}"
            thumbnail="${productItem.thumbnailUrl}"
            variant-axes="${productItem.variantAxesMapJson}"></we-product-variant>

        <div class="row">

            <div class="col-md-5 col-md-offset-1">
                <div class="we-Product-visual"
                     data-sly-use.hapiProductAsset="${'org.apache.sling.hapi.sightly.HApiUse' @ type=hapiProduct.proptype.assets}"
                     data-sly-attribute="${hapiProduct.itemprop.assets}">
                    <img src="${productModel.productItem.imageUrl}" class="img-responsive" v-bind:src="product.image"
                         data-sly-attribute="${hapiProductAsset.itemprop.path}" />
                </div>
            </div>

            <div class="col-md-5 col-md-offset-1">
                <div class="row">
                    <div class="col-xs-6">
                        <strong class="we-Product-brand h4" v-html="product.description"
                                data-sly-attribute="${hapiProduct.itemprop.description}">${productModel.productItem.description}</strong>
                    </div>
                    <div class="col-xs-6 text-right">
                        <span class="we-Product-code">${ 'SKU:' @ i18n } <span v-text="product.sku"
                                                                           data-sly-attribute="${hapiProduct.itemprop.sku}">
                            ${productModel.productItem.sku}</span></span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <h1 class="we-Product-name" v-html="product.title"
                            data-sly-attribute="${hapiProduct.itemprop.name}">${productModel.productItem.title}</h1>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <strong class="we-Product-price h2" v-html="product.price"
                                data-sly-attribute="${hapiProduct.itemprop.price}">${productModel.productItem.price}</strong>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="we-Product-description separator" v-html="product.summary"
                             data-sly-attribute="${hapiProduct.itemprop.summary}">${productModel.productItem.summary}</div>
                    </div>
                </div>
                <div class="we-Product-form">
                    <sly data-sly-list.axisName="${productModel.productItem.variantsAxesValues}">
                    <div class="form-group fg-title">
                        <label>${axisName @ i18n}</label>
                    </div>
                    <div class="form-group fg-content">
                        <div class="we-Product-radio marker radio-inline" data-sly-repeat.axisValue="${productModel.productItem.variantsAxesValues[axisName]}">
                            <label>
                                <input data-sly-test="${axisName != 'color'}" type="radio" name="${axisName}" value="${axisValue}" title="${axisValue}"
                                       v-bind:checked="isChecked('${axisName}','${axisValue}')" v-on:click="setProduct" />
                                <input data-sly-test="${axisName == 'color'}" type="radio" name="${axisName}" value="${axisValue}" title="${axisValue}"
                                       v-bind:checked="isChecked('${axisName}','${axisValue}')" v-on:click="setProduct"
                                       style="background-color:${axisValue @context='styleString'};" />
                                <div data-sly-test="${axisName != 'color'}">${axisValue}</div>
                                <div data-sly-test="${axisName == 'color'}" style="background-color:${axisValue @context='styleString'};"></div>
                            </label>
                        </div>
                    </div>
                    </sly>

                    <div class="form-group">
                        <div class="row">
                            <div class="col-md-4">
                            </div>
                            <div class="col-md-8 text-right">
                                <div class="we-Product-actions we-Product-actions--disabled">
                                    <button type="button" class="btn btn-action btn-primary" disabled aria-disabled="true">${ 'Add to cart' @ i18n }</button>
                                    <button type="button" class="btn btn-icon btn-primary" disabled aria-disabled="true">
                                        <i class="fa fa-heart-o"></i>
                                    </button>
                                </div>
                                <p class="we-Product-unavailable">
                                    ${'Purchase actions are unavailable in this CIF migration.' @ i18n}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </sly>

</div>
